<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10253d"><link rel="manifest" href="manifest.webmanifest"><title>화목 훈련 페이스</title><style>:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#142338;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:22px 16px 45px}h1{font-size:25px;margin:4px 0}p{color:#657286;font-size:13px;margin:4px 0 18px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.switch button,.actions button,.step button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}.switch button{background:#e4eaf0;color:#526071}.switch .active{background:#1456ba;color:white}.switch .active.lt{background:#16846e}.panel{background:white;border-radius:17px;padding:16px;box-shadow:0 4px 18px #152f4c0d;margin:11px 0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.parttitle{font-size:17px;font-weight:850}.inputrow{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}.pacehint{font-size:12px;color:#24547c;background:#edf5ff;border-radius:8px;padding:7px 9px;font-weight:750}.shareselect{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:13px;color:#41536a}.shareselect input{width:19px;height:19px;accent-color:#1456ba}.sharehelp{font-size:12px;color:#657286;margin:10px 2px}.inputrow label{font-size:12px;color:#667;white-space:nowrap}.inputrow input{width:120px;max-width:45%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:19px;font-weight:700}.splits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.split{background:#f0f5fb;border-radius:12px;padding:11px 4px;text-align:center}.split small{display:block;color:#5d6b80;font-weight:700}.split strong{display:block;font-size:22px;margin-top:5px;white-space:nowrap}.step{display:flex;gap:6px}.step button{padding:7px 12px;background:#edf1f5;color:#34475c}.step .minus{color:#bf3044}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.actions button{background:#172e4b;color:white}.actions button:first-child{background:#e5ecf6;color:#14385f}.foot{font-size:12px;line-height:1.6;color:#667;margin-top:14px}#shareCanvas{display:none}@media(max-width:380px){.split strong{font-size:18px}}</style></head><body><main class="wrap"><h1>화·목 훈련 페이스</h1><p>10K 기록 입력 후 Enter를 누르면 계산되고 다음 PART로 이동합니다.</p><div class="switch"><button id="vo" class="active">화요일 · VO₂max 90%</button><button id="lt">목요일 · LT 인터벌</button></div><div class="sharehelp">이미지에 넣을 PART를 체크하세요. 원하는 PART만 골라 공유할 수 있습니다.</div><div id="parts"></div><div class="actions"><button id="add">＋ 파트 추가</button><button id="share">이미지 저장·공유</button></div><div class="foot" id="rule"></div></main><canvas id="shareCanvas"></canvas><script>const key='nirc-tue-thu-pace-v1';const selected=new Set();let state={mode:'vo',parts:['39:30','43:00','51:00']};try{let s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.parts)&&s.parts.length)state={mode:s.mode==='lt'?'lt':'vo',parts:s.parts.slice(0,30)}}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state))}function parse(v){let s=String(v).trim().replace(/\s/g,'').replace(/[：∶]/g,':').replace(/분/g,':').replace(/초/g,'');if(/^\d{3,4}$/.test(s))s=s.slice(0,-2)+':'+s.slice(-2);let m=s.match(/^(\d{1,2}):(\d{2})$/);if(!m||+m[2]>59)return null;let t=+m[1]*60 + +m[2];return t>=600&&t<=7200?t:null}function fmt(n){if(n===null)return '—';n=Math.round(n);let min=Math.floor(n/60),sec=n%60;let st=String(sec).padStart(2,'0');return min?min+':'+st:st+'초'}function paceLabel(sec){if(sec===null)return '—';return Math.floor(sec/60)+':'+String(Math.round(sec%60)).padStart(2,'0')}function hint(v){let t=parse(v);if(t===null)return '기본 — → 훈련 —';let base=t/10;return '기본 '+paceLabel(base)+' /km → '+(state.mode==='vo'?'−10초':'＋10초')+' → 훈련 '+paceLabel(base+(state.mode==='vo'?-10:10))+' /km'}function splits(v){let t=parse(v);return [400,200,100].map(d=>t===null?null:(t/10+(state.mode==='vo'?-10:10))*d/1000)}function render(){let vo=state.mode==='vo';$('vo').className=vo?'active':'';$('lt').className=vo?'':'active lt';$('rule').textContent=(vo?'VO₂max 90%: 10K 평균 페이스 −10초/km':'LT 인터벌: 10K 평균 페이스 +10초/km')+' · 100m/200m/400m는 같은 목표 페이스의 통과 시간입니다. 각 거리를 독립 계산한 뒤 정수 반올림합니다(100m 결과를 곱하지 않음). 기록은 이 기기에 자동 저장됩니다.';$('parts').innerHTML='';state.parts.forEach((v,i)=>{let panel=document.createElement('section');panel.className='panel';let times=splits(v);panel.innerHTML=`<div class="panelhead"><div class="parttitle">PART ${i+1}</div><div class="step"><button class="minus" aria-label="파트 ${i+1} 삭제">−</button><button class="plus" aria-label="파트 ${i+1} 다음에 추가">＋</button></div></div><div class="inputrow"><label>10K 기준</label><input inputmode="text" enterkeyhint="next" aria-label="파트 ${i+1} 10K 기록" placeholder="39:30" value="${String(v).replace(/[^0-9:]/g,'')}"><span class="pacehint">${hint(v)}</span></div><label class="shareselect"><input type="checkbox" class="pick" ${selected.has(i)?'checked':''}> 이미지에 PART ${i+1} 포함</label><div class="splits">${[400,200,100].map((d,j)=>`<div class="split"><small>${d}m</small><strong class="t${j}">${fmt(times[j])}</strong></div>`).join('')}</div>`;let input=panel.querySelector('.inputrow input');panel.querySelector('.pick').onchange=e=>{if(e.target.checked)selected.add(i);else selected.delete(i)};const commit=()=>{let seconds=parse(input.value);if(input.value.trim()&&seconds===null){input.setCustomValidity('10K 기록을 4930 또는 49:30 형식으로 입력하세요.');input.reportValidity();return false}input.setCustomValidity('');state.parts[i]=seconds===null?'':Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');input.value=state.parts[i];save();splits(state.parts[i]).forEach((t,j)=>panel.querySelector('.t'+j).textContent=fmt(t));panel.querySelector('.pacehint').textContent=hint(state.parts[i]);return true};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!commit())return;let next=$('parts').querySelectorAll('.inputrow input')[i+1];if(next){next.focus();next.select()}else input.blur()}});input.addEventListener('blur',commit);panel.querySelector('.minus').onclick=()=>{if(state.parts.length===1){alert('최소 1개 파트는 유지합니다.');return}state.parts.splice(i,1);const old=[...selected];selected.clear();old.forEach(n=>{if(n<i)selected.add(n);else if(n>i)selected.add(n-1)});save();render()};panel.querySelector('.plus').onclick=()=>{if(state.parts.length>=30)return alert('최대 30개까지 추가할 수 있습니다.');state.parts.splice(i+1,0,'');const old=[...selected];selected.clear();old.forEach(n=>selected.add(n>i?n+1:n));save();render()};$('parts').appendChild(panel)})} $('vo').onclick=()=>{state.mode='vo';save();render()};$('lt').onclick=()=>{state.mode='lt';save();render()};$('add').onclick=()=>{if(state.parts.length>=30)return alert('최대 30개까지 추가할 수 있습니다.');state.parts.push('');save();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};async function share(){let chosen=[...selected].filter(i=>i>=0&&i<state.parts.length).sort((a,b)=>a-b);if(!chosen.length){alert('이미지로 공유할 PART를 하나 이상 선택하세요.');return}let W=900,margin=46,row=158,H=215+chosen.length*row+95,scale=2,c=$('shareCanvas');c.width=W*scale;c.height=H*scale;let x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#f4f7fb';x.fillRect(0,0,W,H);x.fillStyle='#142d4b';x.fillRect(0,0,W,145);x.fillStyle='white';x.font='bold 40px system-ui';x.fillText('화·목 훈련 페이스',margin,65);x.font='26px system-ui';x.fillText(state.mode==='vo'?'화요일 · VO₂max 90%':'목요일 · LT 인터벌',margin,112);chosen.forEach((idx,k)=>{let v=state.parts[idx],i=idx,y=175+k*row;x.fillStyle='white';round(x,margin,y,W-margin*2,140,18);x.fill();x.fillStyle='#142d4b';x.font='bold 25px system-ui';x.fillText('PART '+(i+1),margin+22,y+37);x.font='21px system-ui';x.fillStyle='#60738b';x.fillText('10K '+(parse(v)===null?'미입력':fmt(parse(v))),margin+22,y+76);x.font='18px system-ui';x.fillStyle='#345c80';x.fillText(hint(v),margin+22,y+104);splits(v).forEach((t,j)=>{let xx=margin+300+j*164;x.fillStyle='#65768b';x.font='bold 20px system-ui';x.fillText([400,200,100][j]+'m',xx,y+35);x.fillStyle='#123c72';x.font='bold 31px system-ui';x.fillText(fmt(t),xx,y+80)})});x.fillStyle='#6b7a8b';x.font='21px system-ui';x.fillText(state.mode==='vo'?'기준: 10K 페이스 −10초/km':'기준: 10K 페이스 +10초/km',margin,H-47);let blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob){alert('이미지 생성 실패');return}let file=new File([blob],'training-pace.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'훈련 페이스'});return}catch(e){if(e.name==='AbortError')return}}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='training-pace.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}$('share').onclick=share;state.parts.forEach((_,i)=>selected.add(i));render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
